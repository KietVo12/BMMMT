server:
  port: 8080

spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: secureapi

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html

jwt:
  secret: your-256-bit-secret-key-here
  expiration: 86400000 # 24 hours in milliseconds

logging:
  level:
    org.springframework.security: DEBUG
    com.example: DEBUG 